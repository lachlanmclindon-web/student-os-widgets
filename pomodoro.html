<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pomodoro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #191919;
      --ink: #e8efe9;
      --muted: #8aa396;
      --teal: #3d8b73;
      --gold: #c9a227;
      --btn: #222;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "VT323", monospace; }
    body { display: flex; align-items: center; justify-content: center; padding: 8px; }
    .wrap { width: 100%; max-width: 320px; text-align: center; }
    .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
    .tabs button {
      flex: 1;
      font-family: inherit;
      font-size: 15px;
      background: var(--btn);
      color: var(--muted);
      border: 1px solid #333;
      padding: 6px 4px;
      cursor: pointer;
    }
    .tabs button.active { color: var(--gold); border-color: var(--teal); }
    .time {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(22px, 9vw, 34px);
      color: var(--gold);
      margin: 12px 0;
      letter-spacing: 2px;
    }
    .actions, .settings-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    button.act, .settings-toggle {
      font-family: inherit;
      font-size: 18px;
      background: var(--teal);
      color: #111;
      border: 0;
      padding: 6px 12px;
      cursor: pointer;
    }
    button.act.ghost, .settings-toggle { background: var(--btn); color: var(--ink); border: 1px solid #333; }
    .settings { display: none; margin-top: 12px; text-align: left; font-size: 17px; }
    .settings.open { display: block; }
    .settings label { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; color: var(--muted); }
    .settings input { width: 64px; background: #111; color: var(--ink); border: 1px solid #333; font-family: inherit; font-size: 17px; padding: 2px 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tabs">
      <button type="button" id="tab-pomodoro" class="active">Pomodoro</button>
      <button type="button" id="tab-short">Short break</button>
      <button type="button" id="tab-long">Long break</button>
    </div>
    <div class="time" id="time">25:00</div>
    <div class="actions">
      <button type="button" class="act" id="start">Start</button>
      <button type="button" class="act ghost" id="reset">Reset</button>
    </div>
    <button type="button" class="settings-toggle" id="toggle" style="margin-top:10px;">Settings</button>
    <div class="settings" id="settings">
      <label>Pomodoro (min) <input id="pomoMins" type="number" min="1" max="90" value="25" /></label>
      <label>Short break (min) <input id="shortMins" type="number" min="1" max="30" value="5" /></label>
      <label>Long break (min) <input id="longMins" type="number" min="1" max="60" value="15" /></label>
    </div>
  </div>
  <script>
    const KEY = "student-os-pomodoro-settings";
    const defaults = { pomodoro: 25, short: 5, long: 15 };
    let settings = Object.assign({}, defaults, JSON.parse(localStorage.getItem(KEY) || "{}"));
    let mode = "pomodoro";
    let remaining = settings.pomodoro * 60;
    let running = false;
    let timer = null;

    const timeEl = document.getElementById("time");
    const startBtn = document.getElementById("start");
    const inputs = { pomodoro: document.getElementById("pomoMins"), short: document.getElementById("shortMins"), long: document.getElementById("longMins") };

    function pad(n) { return String(n).padStart(2, "0"); }
    function render() {
      timeEl.textContent = pad(Math.floor(remaining / 60)) + ":" + pad(remaining % 60);
      startBtn.textContent = running ? "Pause" : "Start";
    }
    function duration() { return (settings[mode] || defaults[mode]) * 60; }
    function setMode(next) {
      mode = next;
      running = false;
      clearInterval(timer);
      remaining = duration();
      document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("active"));
      document.getElementById("tab-" + (mode === "short" ? "short" : mode === "long" ? "long" : "pomodoro")).classList.add("active");
      render();
    }
    function save() {
      settings = {
        pomodoro: Math.max(1, Number(inputs.pomodoro.value) || 25),
        short: Math.max(1, Number(inputs.short.value) || 5),
        long: Math.max(1, Number(inputs.long.value) || 15)
      };
      localStorage.setItem(KEY, JSON.stringify(settings));
      if (!running) { remaining = duration(); render(); }
    }
    inputs.pomodoro.value = settings.pomodoro;
    inputs.short.value = settings.short;
    inputs.long.value = settings.long;
    Object.values(inputs).forEach((el) => el.addEventListener("change", save));

    document.getElementById("tab-pomodoro").onclick = () => setMode("pomodoro");
    document.getElementById("tab-short").onclick = () => setMode("short");
    document.getElementById("tab-long").onclick = () => setMode("long");
    document.getElementById("toggle").onclick = () => document.getElementById("settings").classList.toggle("open");
    document.getElementById("reset").onclick = () => { running = false; clearInterval(timer); remaining = duration(); render(); };
    startBtn.onclick = () => {
      if (running) { running = false; clearInterval(timer); render(); return; }
      running = true;
      timer = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          remaining = 0;
          running = false;
          clearInterval(timer);
        }
        render();
      }, 1000);
      render();
    };
    setMode("pomodoro");
  </script>
</body>
</html>
